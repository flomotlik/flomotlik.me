name: Terraform (DNS)

on:
  pull_request:
    paths: ['terraform/*', '.github/workflows/terraform.yml']
  push:
    branches: [master]
    paths: ['terraform/*', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for the OIDC token
  pull-requests: write   # to post the plan on the PR

concurrency:
  group: terraform-dns
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - run: terraform fmt -check      # bootstrap/ is applied by hand, not here
      - run: terraform init -input=false
      - run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      # A plan that destroys anything in this zone is almost certainly a
      # mistake - the MX records carry live email. Fail loudly rather than
      # letting an apply follow it.
      - name: Refuse a destructive plan
        run: |
          terraform show -json tfplan > plan.json
          destroys=$(python3 -c "import json;print(sum(1 for r in json.load(open('plan.json')).get('resource_changes',[]) if 'delete' in r['change']['actions']))")
          echo "resources planned for deletion: $destroys"
          if [ "$destroys" -ne 0 ]; then
            echo "::error::Plan would delete $destroys resource(s). Refusing. Review by hand."
            exit 1
          fi

      - name: Comment the plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('terraform show -no-color tfplan', { cwd: 'terraform' }).toString();
            const body = ['<details><summary>Terraform plan</summary>', '',
                          '```terraform', plan.slice(0, 60000), '```', '</details>'].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Apply
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: terraform apply -input=false -no-color tfplan
