baseURL             = "https://flomotlik.me/"
buildDrafts         = false
canonifyURLs        = false
contentDir          = "content"
languageCode        = "en-US"
layoutDir           = "layouts"
publishDir          = "public"
author              = "Florian Motlik"
title               = "Florian Motlik - AWS Consultant"
pluralizeListTitles = false

# Modern Hugo requires explicit markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

[permalinks]
blog  = "blog/:slug/"

[params]
dateform     = "Jan 2, 2006"
dateformfull = "Mon Jan 2 2006 15:04:05 MST"
description  = "Independent AWS consultant with 15+ years of experience helping teams build scalable, secure cloud infrastructure."
tagline      = "AWS Infrastructure Expert"
logofile     = "img/logo.png"
faviconfile  = "img/favicon.ico"
highlightjs  = false
progressively = false
latestpostcount = 5
lang         = "en"
github       = "flomotlik"
email        = "flo@flomotlik.me"
linkedin     = "florianmotlik"
social_banner = "img/headshot.jpg"

# Podcast URLs
podcast_spotify = "https://open.spotify.com/show/7rj9KZWKljrAheNNiNk83j"
podcast_apple   = "https://podcasts.apple.com/at/podcast/aws-news-weekly/id1775481091"
podcast_episodes = "28+"

# Experience
years_experience = "15+"

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]
